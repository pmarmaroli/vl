name: VL Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: pip install -e ".[dev]"

    - name: Run test suite
      run: pytest -q

    - name: Set up Node.js for JavaScript smoke test
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: CLI smoke test (Python target)
      run: |
        vl examples/basic/loops.vl --target python --output test_output_py.py
        python test_output_py.py

    - name: CLI smoke test (JavaScript target)
      run: |
        vl examples/basic/loops.vl --target javascript --output test_output_js.js
        node test_output_js.js

    - name: Minifier and v2 smoke tests
      run: |
        vl-minify src/vl/py_minify.py > /dev/null
        vl2 --spec > /dev/null
      shell: bash
