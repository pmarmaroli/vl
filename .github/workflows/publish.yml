name: Publish to PyPI

# Publishes the very-little package via PyPI Trusted Publishing (OIDC).
# No API token is stored anywhere: PyPI trusts this exact repository,
# workflow file and environment. Configure once on pypi.org:
#   Account -> Publishing -> Add a new pending publisher
#   project: very-little, owner: pmarmaroli, repo: vl,
#   workflow: publish.yml, environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
