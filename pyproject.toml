[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "very-little"
version = "0.3.0a0"
description = "VL (Very Little): token-efficiency toolkit for AI coding — semantic Python minifier and VL v2 macros"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
authors = [{ name = "Patrick Marmaroli" }]
keywords = ["llm", "tokens", "minifier", "ai", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Pre-processors",
]

[project.urls]
Homepage = "https://github.com/pmarmaroli/vl"
Issues = "https://github.com/pmarmaroli/vl/issues"

[project.scripts]
vl-minify = "vl.py_minify:main"
vl2 = "vl.v2.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
benchmarks = ["mistral-common>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/manual --ignore=tests/benchmarks --ignore=tests/experiments"
